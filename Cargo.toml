[package]
name = "bbs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
gethostname = "1.1.0"
humantime = "2.4.0"
rand = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
